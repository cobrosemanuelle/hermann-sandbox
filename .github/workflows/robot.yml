name: Robot de pruebas
on: [workflow_dispatch, push]
concurrency: { group: robot, cancel-in-progress: true }
jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Esperar Vercel
        if: github.event_name == 'push'
        run: sleep 100
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright-core@1.49.0 >/dev/null
      - name: Robot
        env:
          ROBOT_USER: sandbox@test.com
          ROBOT_PASS: ${{ secrets.ROBOT_PASS }}
          BASE_URL: https://hermann-sandbox.vercel.app
          PW_PATH: /tmp/pw/node_modules/playwright-core
          CHROME_EXE: /usr/bin/google-chrome
          HEADLESS: '1'
          SLOW: '120'
        run: |
          mkdir -p tests/out && cd tests/out
          node ../noa_bot.mjs 2>&1 | tee ../../log.txt || true
          cd ../..
          { echo '## Robot'; grep -a 'pasos' log.txt | tail -1; grep -a '❌' log.txt | sort -u | head -40; } >> "$GITHUB_STEP_SUMMARY"
          if grep -aq '❌' log.txt; then exit 1; fi
          if ! grep -aq 'pasos' log.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: capturas, path: tests/out, if-no-files-found: ignore }
